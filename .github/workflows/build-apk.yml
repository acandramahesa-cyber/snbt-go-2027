name: Build Android APK (SNBT GO 2027)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Sync Capacitor
        run: |
          npm install --legacy-peer-deps
          npm run android:prep

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Rename output APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SNBT-GO-2027-RealmeC30.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNBT-GO-2027-APK
          path: SNBT-GO-2027-RealmeC30.apk
          retention-days: 30
